<main class="main">
<section class="contact">
<h2 class="contact__title">contact</h2>
<form class="contact__form" id="contact-form">
<label class="contact__label" for="name">name</label>
<input class="contact__field" type="text" id="name" name="name" required>
<label class="contact__label" for="email">email</label>
<input class="contact__field" type="email" id="email" name="email" required>
<label class="contact__label" for="message">message</label>
<textarea class="contact__field" id="message" name="message" rows="4" required></textarea>
<label class="contact__label contact__label--checkbox"><input type="checkbox" name="agree" required> agree</label>
<button class="contact__button" type="submit">send</button>
</form>
</section>
